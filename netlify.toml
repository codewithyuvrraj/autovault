# AutoVault — Netlify build settings
# These are read automatically when you import the GitHub repo, so no
# manual fields are needed in the Netlify dashboard.

[build]
  command = "cd client && npm ci && npm run build"
  publish = "client/dist"

# Point the deployed frontend at the hosted API (Vite exposes this as
# import.meta.env.VITE_API_URL — see client/src/api.js)
[build.environment]
  VITE_API_URL = "https://autovault-api-ruze.onrender.com"

# This static site has no API backend: /api/* must return 404 (not the SPA shell),
# so the app's fetch calls fail cleanly instead of receiving index.html with HTTP 200.
[[redirects]]
  from = "/api/*"
  to = "/api-unavailable"
  status = 404

# SPA fallback: unknown paths serve the app (so deep links work)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache the built assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
